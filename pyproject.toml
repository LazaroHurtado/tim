[project]
name = "tim"
version = "0.1.0"
description = "A hands-on Ray, vLLM, and PyTorch train-inference logprob mismatch probe"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets==5.2.0",
    "huggingface-hub>=1.31.0,<2",
    "hydra-core>=1.3.2,<2",
    "omegaconf>=2.3,<3",
    "pydantic>=2.12,<3",
    "ray==2.60.0",
    "torch==2.14.0",
    "transformers>=5.16.1,<5.21",
    "vllm==0.33.0",
    "wandb==0.31.0",
]

[dependency-groups]
dev = ["ruff==0.17.5"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
