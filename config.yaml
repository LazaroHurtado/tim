trainer:
  model: Qwen/Qwen2.5-0.5B-Instruct
  revision: main
  steps: 1000
  batch_size: 4
  seed: 42
  learning_rate: 0.000001

generator:
  sampling_params:
    n: 16 # rollouts per sample, make this larger than 1 for advantage calculation
    max_tokens: 4096
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    logprobs: 1
    seed: 42
  engine:
    dtype: bfloat16
    enforce_eager: true
    generation_config: vllm
    logprobs_mode: processed_logprobs
    distributed_executor_backend: uni
    weight_transfer_config:
      backend: nccl
    enable_prefix_caching: false
    gpu_memory_utilization: 0.65
    seed: ${generator.sampling_params.seed}

wandb:
  mode: online
  project: tim

output_dir: outputs/${now:%Y%m%d-%H%M%S-%f}
